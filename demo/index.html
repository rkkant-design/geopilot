<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GeoPilot: a clickable demo of a Generative Engine Optimization (GEO) platform. Simulated data for a fictional brand.">
<title>GeoPilot Client Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy rail whose nav groups trace the GEO loop (Measure → Diagnose → Act → Prove), content column of panels; rail becomes a tab strip under 900px */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#edf2f5; --ink:#0f1c2b; --ink-2:#4a5767; --muted:#7f8c9b;
  --line:#dce3ea; --line-2:#c8d1da; --accent:#0d8a89; --accent-ink:#086b6a; --accent-wash:#e0f2f1;
  --rail:#0e2740; --rail-ink:#c9d6e3; --rail-muted:#7f95ab; --rail-active:#173a5c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --neg:#e34948; --pos:#2a78d6; --mid:#f0efec;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300;
  --shade:rgba(42,120,214,.06);
  --font-display:"Sora","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a121e; --surface:#101b2b; --surface-2:#16243a; --ink:#e7edf4; --ink-2:#a9b6c5; --muted:#7a899b;
  --line:#21314a; --line-2:#2c3f5c; --accent:#2fb5b2; --accent-ink:#5fd0cd; --accent-wash:#11302f;
  --rail:#07101b; --rail-ink:#c9d6e3; --rail-muted:#71869c; --rail-active:#132842;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --neg:#e66767; --pos:#3987e5; --mid:#383835; --good-ink:#0ca30c; --shade:rgba(57,135,229,.09);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a121e; --surface:#101b2b; --surface-2:#16243a; --ink:#e7edf4; --ink-2:#a9b6c5; --muted:#7a899b;
  --line:#21314a; --line-2:#2c3f5c; --accent:#2fb5b2; --accent-ink:#5fd0cd; --accent-wash:#11302f;
  --rail:#07101b; --rail-ink:#c9d6e3; --rail-muted:#71869c; --rail-active:#132842;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --neg:#e66767; --pos:#3987e5; --mid:#383835; --good-ink:#0ca30c; --shade:rgba(57,135,229,.09);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:22px;font-weight:600}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:12px}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:22px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:17px;color:#fff}
.logo svg{flex:none}
.logo small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--rail-muted);letter-spacing:.02em}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .gl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--rail-muted);padding:0 10px 6px;display:flex;align-items:center;gap:8px}
.navgroup .gl b{font-family:var(--font-mono);font-weight:500;color:var(--accent-ink)}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;color:var(--rail-ink);cursor:pointer;font-size:13.5px}
.nav:hover{background:rgba(255,255,255,.05)}
.nav[aria-current="page"]{background:var(--rail-active);color:#fff;box-shadow:inset 2px 0 0 #2fb5b2}
.nav svg{flex:none;opacity:.8}
.rail .foot{margin-top:auto;font-size:11.5px;color:var(--rail-muted);line-height:1.45}
.rail .foot b{color:var(--rail-ink);font-weight:500}

.main{min-width:0;padding-block:18px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
.ws{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px}
.ws .av{width:26px;height:26px;border-radius:50%;background:var(--s1);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:12px}
.ws b{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.pill.demo{border-color:transparent;background:var(--accent-wash);color:var(--accent-ink);font-weight:500}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12px}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px;margin-bottom:16px}
.head .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-ink);font-weight:600;margin-bottom:4px}
.head p{color:var(--ink-2);max-width:68ch;margin-top:4px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g-46{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.panel>.ph .sub{color:var(--muted);font-size:12.5px}
.panel>.ph .right{margin-left:auto}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lb{font-size:12.5px;color:var(--ink-2)}
.tile .val{font-family:var(--font-body);font-weight:600;font-size:26px;letter-spacing:-.01em}
.tile .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.tile .dl{font-size:12.5px}
.up{color:var(--good-ink);white-space:nowrap} .down{color:var(--crit);white-space:nowrap}
.hero{background:var(--surface);border-color:var(--line)}
.hero .val{font-size:50px;line-height:1.05}
.hero .ci{font-size:13px;color:var(--ink-2)}
.cibar{position:relative;height:6px;border-radius:3px;background:var(--surface-2);margin:6px 0 2px}
.cibar span{position:absolute;top:0;bottom:0;border-radius:3px;background:color-mix(in srgb,var(--s1) 35%,transparent)}
.cibar i{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--s1)}

/* three instruments */
.instr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.inst{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2);min-width:0}
.inst .t{font-weight:600;font-size:13px}
.inst .s{font-size:11.5px;color:var(--muted)}
.inst .v{font-size:24px;font-weight:600;margin-top:6px}
.inst .meter{height:6px;background:color-mix(in srgb,var(--s1) 18%,transparent);border-radius:3px;margin-top:6px;overflow:hidden}
.inst .meter span{display:block;height:100%;background:var(--s1);border-radius:3px}
.arrow{color:var(--muted)}

/* heatmap */
.hm{width:100%;border-collapse:separate;border-spacing:2px;font-variant-numeric:tabular-nums}
.hm th{font-weight:500;font-size:12px;color:var(--ink-2);text-align:left;padding:4px 6px}
.hm th.c{text-align:center}
.hm td{height:40px;text-align:center;border-radius:4px;font-weight:600;font-size:13px}
.hm td.na{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 10px);color:var(--muted);font-weight:400;font-size:11.5px;cursor:help}
.scroll{overflow-x:auto}

/* chips & status */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.st svg{flex:none}
.ev{font-size:11.5px;border-radius:5px;padding:2px 8px;font-weight:500;white-space:nowrap;border:1px solid}
.ev.proven{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 9%,transparent)}
.ev.backed{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-wash)}
.ev.plaus{color:var(--ink-2);border-color:var(--line-2);background:var(--surface-2)}
.ev.none{color:var(--muted);border-color:var(--line-2);background:transparent;text-decoration:line-through}

/* tables */
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t th.r,table.t td.r{text-align:right}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t tr.sel td{background:var(--accent-wash)}
.bname{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.you{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:0 4px}

/* bar with CI */
.barcell{position:relative;height:22px;min-width:140px}
.barcell .track{position:absolute;inset:7px 0;background:var(--surface-2);border-radius:4px}
.barcell .bar{position:absolute;left:0;top:5px;height:12px;border-radius:0 4px 4px 0}
.barcell .wh{position:absolute;top:11px;height:1.5px;background:var(--ink-2)}
.barcell .wh::before,.barcell .wh::after{content:"";position:absolute;top:-4px;width:1.5px;height:9px;background:var(--ink-2)}
.barcell .wh::before{left:0}.barcell .wh::after{right:0}

/* segmented bars */
.seg{display:flex;gap:2px;height:22px;border-radius:4px;overflow:hidden}
.seg span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.seg span.dk{color:#0b0b0b}
.seg span:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.segrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:8px}
.segrow .l{font-size:12.5px;color:var(--ink-2)}

/* diverging */
.dv{display:grid;grid-template-columns:150px minmax(0,1fr) 48px 64px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.dv:last-child{border-bottom:0}
.dv .lab{font-size:13px}
.dv .lab small{display:block;font-size:11px;color:var(--muted)}
.dv .area{position:relative;height:22px}
.dv .area .axis{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}
.dv .area .b{position:absolute;top:5px;height:12px}
.dv .area .avg{position:absolute;top:1px;width:2px;height:20px;background:var(--ink);border-radius:1px}
.dv .v{text-align:right;font-weight:600}
.dv .d{text-align:right;font-size:12px}

/* lists / cards */
.cards{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);min-width:0}
.cards.g3>.card{display:flex;flex-direction:column;align-items:flex-start}.cards.g3>.card .btn{margin-top:auto!important}.cards.g3>.card p{margin-bottom:10px}
.card .top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
.card .top .ttl{font-weight:600}
.sev{border-left:3px solid var(--line-2);padding-left:12px}
.sev.crit{border-left-color:var(--crit)} .sev.warn{border-left-color:var(--warn)} .sev.good{border-left-color:var(--good)}
.src{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.src div{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
.src .dm{font-family:var(--font-mono);font-size:11.5px;color:var(--ink);background:var(--surface-2);border-radius:4px;padding:1px 6px;white-space:nowrap}
.fix{margin-top:10px;font-size:12.5px;background:var(--surface-2);border-radius:6px;padding:8px 10px}
.fix b{color:var(--accent-ink)}

/* prompts / answers */
.fam-badge{font-size:11px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.answer{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:14px 16px;font-size:13.5px;line-height:1.6}
.answer ol{margin:8px 0;padding-left:22px}
.answer li{margin:4px 0}
.answer .q{font-weight:600;margin-bottom:8px;display:flex;gap:8px}
.answer .q::before{content:"Q";font-family:var(--font-mono);font-size:11px;color:var(--surface);background:var(--ink-2);border-radius:4px;padding:1px 5px;height:fit-content;margin-top:2px}
mark.cl{background:color-mix(in srgb,var(--s1) 22%,transparent);color:inherit;border-radius:3px;padding:0 2px;font-weight:600}
mark.co{background:none;color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
sup.c{font-family:var(--font-mono);font-size:10px;color:var(--accent-ink)}
.cgrid{display:grid;grid-template-columns:62px repeat(8,minmax(0,1fr));gap:3px;font-size:11px;align-items:center}
.cgrid .h{color:var(--muted);text-align:center}
.cgrid button{height:20px;border-radius:3px;border:0;cursor:pointer;padding:0}
.cgrid button.y{background:var(--s1)}
.cgrid button.n{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.cgrid button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}

/* funnel */
.fn td.stage{min-width:76px}
.mini{display:flex;align-items:center;gap:6px}
.mini .tr{flex:1;height:6px;background:var(--surface-2);border-radius:3px;min-width:32px;overflow:hidden}
.mini .tr span{display:block;height:100%;border-radius:3px;background:var(--s1)}
.mini .tr span.br{background:var(--crit)}
.mini b{font-weight:500;font-size:12px;min-width:30px;text-align:right}
.brk{font-size:12px;font-weight:600}

/* experiments */
.exlist{display:flex;flex-direction:column;gap:8px}
.exbtn{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;gap:3px}
.exbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.exbtn .id{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.exbtn .nm{font-weight:600;font-size:13px}
.result{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.result .big{font-size:34px;font-weight:600;line-height:1}
.prereg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;font-size:12.5px;margin-top:12px}
.prereg div span{display:block;color:var(--muted);font-size:11.5px}

/* charts */
.chart{width:100%;min-height:120px;position:relative}
.chart svg{display:block;overflow:visible}
.chart .gline{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.chart .elab{fill:var(--ink);font-size:11.5px;font-weight:600;font-family:var(--font-body)}
.chart .elab2{fill:var(--ink-2);font-size:11px;font-family:var(--font-body)}
.chart .shade{fill:var(--shade)}
.chart .evl{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:0}
.chart .evc{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.5}
.chart .evt{fill:var(--ink);font-size:10px;font-weight:600;font-family:var(--font-mono)}
.chart .xh{stroke:var(--ink-2);stroke-width:1}
.evlist{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink-2);margin-top:8px}
.evlist b{font-family:var(--font-mono);font-weight:600;color:var(--ink)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:7px;padding:8px 10px;font-size:12px;line-height:1.45;max-width:280px;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between}
#tip .r span{display:inline-flex;align-items:center;gap:6px}
#tip .sw{width:8px;height:8px;border-radius:2px}
#tip b{font-weight:600}

/* tour */
#tour{position:fixed;z-index:40;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 50px rgba(8,20,36,.22);padding:16px 18px}
#tour .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-ink);font-weight:600}
#tour h2{margin:4px 0 6px;font-size:16px}
#tour p{color:var(--ink-2);font-size:13px}
#tour .bar{display:flex;align-items:center;gap:8px;margin-top:14px}
#tour .dots{display:flex;gap:4px;flex:1}
#tour .dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
#tour .dots i.on{background:var(--accent)}

.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------------- chart engine ---------------- */
const CHARTS={};
function chartSlot(id,spec){CHARTS[id]=spec;return `<div class="chart" id="${id}"></div>`}
function drawCharts(){for(const id in CHARTS){const el=document.getElementById(id);if(el)drawLine(el,CHARTS[id])}}
function drawLine(el,s){
  const W=Math.max(280,el.clientWidth),H=s.h||240,m={t:s.events?44:12,r:s.endLabels===false?14:92,b:26,l:38};
  const iw=W-m.l-m.r,ih=H-m.t-m.b,n=s.labels.length;
  const X=i=>m.l+i*iw/(n-1),Y=v=>m.t+ih-(clamp(v,s.min,s.max)-s.min)/(s.max-s.min)*ih;
  let g='';
  s.ticks.forEach(t=>{g+=`<line class="${t===s.min?'base':'gline'}" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${m.l-8}" y="${Y(t)+4}" text-anchor="end">${t}${s.unit||''}</text>`});
  const step=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(iw/80))));
  for(let i=0;i<n;i+=step)g+=`<text class="tick" x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':'middle'}">${s.labels[i]}</text>`;
  if(s.shadeFrom!=null)g+=`<rect class="shade" x="${X(s.shadeFrom)}" y="${m.t}" width="${X(n-1)-X(s.shadeFrom)}" height="${ih}"/>`;
  if(s.vline!=null)g+=`<line class="evl" x1="${X(s.vline)}" x2="${X(s.vline)}" y1="${m.t-4}" y2="${m.t+ih}"/><text class="elab2" x="${X(s.vline)+5}" y="${m.t+10}">${esc(s.vlineLabel||'')}</text>`;
  let prevX=-99,row=0;
  (s.events||[]).forEach((e,k)=>{const ex=X(e.i);row=ex-prevX<20&&row===0?1:0;prevX=ex;const cy=m.t-12-row*18;
    g+=`<line class="evl" x1="${ex}" x2="${ex}" y1="${cy+8}" y2="${m.t+ih}" opacity=".5"/><circle class="evc" cx="${ex}" cy="${cy}" r="8"/><text class="evt" x="${ex}" y="${cy+3.5}" text-anchor="middle">${k+1}</text>`});
  s.series.forEach(se=>{
    if(se.pts[0].lo!=null&&s.band!==false&&se.focus){const up=se.pts.map((p,i)=>`${X(i)},${Y(p.hi)}`).join(' '),dn=se.pts.map((p,i)=>`${X(i)},${Y(p.lo)}`).reverse().join(' ');g+=`<polygon points="${up} ${dn}" fill="${se.color}" opacity="0.14"/>`}
  });
  s.series.forEach(se=>{const d=se.pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');g+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.focus?2.5:2}" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="5 4"':''}/>`});
  if(s.endLabels!==false){
    const ends=s.series.map(se=>({se,y:Y(se.pts[n-1].v),v:se.pts[n-1].v})).sort((a,b)=>a.y-b.y);
    for(let k=1;k<ends.length;k++)if(ends[k].y-ends[k-1].y<26)ends[k].ly=(ends[k-1].ly??ends[k-1].y)+26;
    ends.forEach(e=>{const ly=e.ly??e.y;g+=`<circle cx="${X(n-1)}" cy="${e.y}" r="4" fill="${e.se.color}" stroke="var(--surface)" stroke-width="2"/>`;
      if(Math.abs(ly-e.y)>3)g+=`<path d="M${X(n-1)+6},${e.y}L${X(n-1)+12},${ly}" stroke="var(--line-2)" fill="none"/>`;
      g+=`<text class="elab" x="${X(n-1)+14}" y="${ly}">${f1(e.v)}${s.unit||''}</text><text class="elab2" x="${X(n-1)+14}" y="${ly+13}">${esc(e.se.name)}</text>`});
  }
  g+=`<g class="xhg" style="display:none"><line class="xh" y1="${m.t}" y2="${m.t+ih}"/>${s.series.map(se=>`<circle r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`).join('')}</g>`;
  g+=`<rect class="ov" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.aria)}">${g}</svg>`;
  const svg=el.querySelector('svg'),grp=svg.querySelector('.xhg'),ln=grp.querySelector('line'),dots=grp.querySelectorAll('circle');
  const ov=svg.querySelector('.ov');
  ov.addEventListener('mousemove',ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)*W/r.width;const i=clamp(Math.round((px-m.l)/iw*(n-1)),0,n-1);
    grp.style.display='';ln.setAttribute('x1',X(i));ln.setAttribute('x2',X(i));
    s.series.forEach((se,k)=>{dots[k].setAttribute('cx',X(i));dots[k].setAttribute('cy',Y(se.pts[i].v))});
    const rows=s.series.map(se=>({se,p:se.pts[i]})).sort((a,b)=>b.p.v-a.p.v);
    showTip(`<b>${esc(s.tipTitle?s.tipTitle(i):s.labels[i])}</b>${rows.map(({se,p})=>`<div class="r"><span><i class="sw" style="background:${se.color}"></i>${esc(se.name)}</span><span class="num">${f1(p.v)}${s.unit||''}${p.lo!=null?` <span style="opacity:.7">± ${f1((p.hi-p.lo)/2)}</span>`:''}</span></div>`).join('')}`,ev)});
  ov.addEventListener('mouseleave',()=>{grp.style.display='none';hideTip()});
}

/* tooltips */
const tip=document.getElementById('tip');
function showTip(html,ev){tip.innerHTML=html;tip.classList.add('on');const w=tip.offsetWidth,h=tip.offsetHeight;let x=ev.clientX+14,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+h>innerHeight-8)y=ev.clientY-h-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'}
function hideTip(){tip.classList.remove('on')}
document.addEventListener('mousemove',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]');if(t)showTip(t.getAttribute('data-tip'),ev);else if(!ev.target.closest||!ev.target.closest('.ov'))hideTip()});

const RAMP=['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95','#104281'];
function heatCell(v){const k=clamp(Math.round(v/60*(RAMP.length-1)),0,RAMP.length-1);return `background:${RAMP[k]};color:${k>=6?'#ffffff':'#0b0b0b'}`}
function delta(now,prev,unit=' pts'){const d=now-prev;if(Math.abs(d)<.05)return `<span class="muted">no change</span>`;return `<span class="${d>0?'up':'down'}">${d>0?'▲':'▼'} ${f1(Math.abs(d))}${unit}</span>`}
function head(eyebrow,title,lede,right=''){return `<div class="head"><div style="min-width:0;flex:1"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${lede?`<p>${lede}</p>`:''}${right?`<div style="margin-top:12px">${right}</div>`:''}</div></div>`}
function engineTabs(cur,attr='data-eng',withAll=true){return `<div class="tabs" role="group" aria-label="Engine">${withAll?`<button class="tab" ${attr}="all" aria-pressed="${cur==='all'}">All engines</button>`:''}${ENGINES.map(e=>`<button class="tab" ${attr}="${e.id}" aria-pressed="${cur===e.id}">${e.name}</button>`).join('')}</div>`}
function barCI(v,h,color,max=80){const L=clamp(v-h,0,max),Rr=clamp(v+h,0,max);return `<div class="barcell" data-tip="${f1(v)}% (95% interval ${f1(L)}–${f1(Rr)}%)"><div class="track"></div><div class="bar" style="width:${v/max*100}%;background:${color}"></div><div class="wh" style="left:${L/max*100}%;width:${(Rr-L)/max*100}%"></div></div>`}
const instAvg=k=>{const v=ENGINES.map(e=>MATRIX[e.id][k]).filter(x=>x!=null);return v.reduce((a,b)=>a+b,0)/v.length};
const instPrev=k=>{const v=ENGINES.map(e=>PREV_MATRIX[e.id][k]).filter(x=>x!=null);return v.reduce((a,b)=>a+b,0)/v.length};

/* answers */
function famSeed(f,pi,eng,d,r){return hash([f.id,pi,eng,d,r].join('|'))}
function engFactor(eng){return MENTION.nova[eng]/mention('nova','all')}
function cellMention(f,pi,eng,d,r){const R=rng(famSeed(f,pi,eng,d,r));return R()<clamp(f.rate/100*engFactor(eng)*(pi===0?1.04:.96),.02,.97)}
function buildAnswer(f,pi,eng,d,r){
  const R=rng(famSeed(f,pi,eng,d,r)+7),named=cellMention(f,pi,eng,d,r);
  const pool=BRANDS.filter(b=>b.id!=='nova').map(b=>{const p=b.id===f.leader?f.lr/100:mention(b.id,'all')/100*.9;return{b,inc:R()<p||b.id===f.leader,score:(b.id===f.leader?1.2:b.pos)+R()*1.4}}).filter(x=>x.inc);
  if(named)pool.push({b:B.nova,inc:true,score:f.npos+R()*1.2-.6});
  pool.sort((a,b)=>a.score-b.score);const list=pool.slice(0,5);
  const doms=['toolsguru.in','g2.com','reddit.com','capterra.in','smbtechreview.in','economictimes.indiatimes.com','youtube.com','orbitly.com'];
  const cites=[];if(named&&R()<f.funnel[2]/Math.max(1,f.rate)*1.1)cites.push('novacrm.in');while(cites.length<3){const x=doms[Math.floor(R()*doms.length)];if(!cites.includes(x))cites.push(x)}
  const pos=list.findIndex(x=>x.b.id==='nova');
  const tone=!named?'—':f.brk==='narrative'&&R()<.5?'Mixed':R()<.8?'Positive':'Neutral';
  const items=list.map((x,k)=>{const cl=x.b.client;const ci=1+Math.floor(R()*cites.length);const extra=cl&&tone==='Mixed'?(f.id==='scale'?' Some reviewers say it slows down with very large teams.':' Some users mention slower support on the entry plans.'):'';return `<li>${cl?'<mark class="cl">':'<mark class="co">'}${x.b.name}</mark>: ${x.b.blurb}.${extra} <sup class="c">[${cl&&cites[0]==='novacrm.in'?1:ci}]</sup></li>`}).join('');
  const html=`<div class="q">${esc(f.prompts[pi])}</div><p>For ${esc(f.topic)}, these are the options most often recommended:</p><ol>${items}</ol><p>If budget and India-specific features matter most, shortlist two and run a free trial with your own data before deciding.</p>
   <div class="src" style="margin-top:10px">${cites.map((c,k)=>`<div><span class="mono muted">[${k+1}]</span><span class="dm">${c}</span></div>`).join('')}</div>`;
  return{html,named,pos:pos<0?null:pos+1,cites,tone,brands:list.length}}

V.experiments=()=>{
  const e=EXPS.find(x=>x.id===state.exp);
  const done=EXPS.filter(x=>!x.running);
  const fmin=-10,fmax=30,fx=v=>(v-fmin)/(fmax-fmin)*100;
  let body;
  if(e.running){body=`<div class="panel"><div class="ph"><h2>${e.id} · ${e.name}</h2>${status('run')}</div>

    <div class="fix" style="margin-top:14px"><b>No peeking.</b> Results stay sealed until the readout date. Checking early and stopping on a good week is how false wins get reported.</div></div>`}
  else{
    const lo=e.est-e.half,hi=e.est+e.half,sig=lo>0;
    body=`<div class="panel"><div class="ph"><h2>${e.id} · ${e.name}</h2>${status(e.sev,e.status)}</div>
    <p class="ink2" style="max-width:62ch">${e.hyp}</p>
    <div class="result" style="margin:14px 0 4px"><div><div class="muted" style="font-size:12px">Effect (difference-in-differences)</div><div class="big num">${sgn(e.est)} pts</div></div><div class="num ink2">95% interval ${sgn(lo)} to ${sgn(hi)} pts<br>${sig?'Interval excludes zero: the change caused a lift.':'Interval includes zero: no measurable effect.'}</div></div>
    ${chartSlot('exChart',{series:[{name:'Treatment',color:'var(--s1)',pts:e.t.map(v=>({v})),focus:true},{name:'Holdout',color:'var(--s2)',pts:e.c.map(v=>({v}))}],labels:WEEKS,min:e.id==='GP-03'?0:e.id==='GP-02'?20:0,max:e.id==='GP-03'?25:e.id==='GP-02'?60:50,ticks:e.id==='GP-03'?[0,5,10,15,20,25]:e.id==='GP-02'?[20,30,40,50,60]:[0,10,20,30,40,50],unit:'%',band:false,shadeFrom:6,vline:6,vlineLabel:'Change shipped '+e.ship,h:250,aria:'Treatment and holdout weekly values',tipTitle:i=>'Week of '+WEEKS[i]})}
    <div class="legend"><span><i class="sw" style="background:var(--s1)"></i>Treatment: ${e.tGroup}</span><span><i class="sw" style="background:var(--s2)"></i>Holdout: ${e.cGroup}</span></div>
    <div class="prereg"><div><span>Primary metric</span>${e.metric}</div><div><span>Smallest effect that matters</span>${e.min}</div><div><span>Registered before launch</span>${e.reg}</div><div><span>Shipped · readout</span>${e.ship} · ${e.readout}</div></div></div>`}
  return head('Prove','Experiments: did the fix cause the lift?','AI answers move on their own. To prove a fix worked, we change one group of questions, hold back a similar group, register the test before launch, and compare the two.')+
  `<div class="grid g-46">
    <div class="grid" style="align-content:start">
     <div class="panel"><div class="ph"><h2>All experiments</h2></div><div class="exlist">${EXPS.map(x=>`<button class="exbtn" data-exp="${x.id}" aria-pressed="${x.id===e.id}"><span class="id">${x.id} · readout ${x.readout}</span><span class="nm">${x.name}</span>${status(x.sev,x.status)}</button>`).join('')}</div></div>
     <div class="panel"><div class="ph"><h2>Results at a glance</h2><span class="sub">effect in pts with 95% interval</span></div>
      <div style="position:relative;margin-left:58px;margin-right:12px;padding:4px 0 24px">
       <div style="position:absolute;top:0;bottom:22px;left:${fx(0)}%;width:1px;background:var(--line-2)"></div>
       ${done.map(x=>{const lo=x.est-x.half,hi=x.est+x.half,c=lo>0?'var(--s1)':'var(--muted)';return `<div style="position:relative;height:34px" data-tip="${x.id}: ${sgn(x.est)} pts (${sgn(lo)} to ${sgn(hi)})"><span class="mono" style="position:absolute;left:-58px;top:8px">${x.id}</span><div style="position:absolute;top:16px;height:2px;left:${fx(lo)}%;width:${fx(hi)-fx(lo)}%;background:${c}"></div><div style="position:absolute;top:11px;width:12px;height:12px;border-radius:50%;left:calc(${fx(x.est)}% - 6px);background:${c};box-shadow:0 0 0 2px var(--surface)"></div></div>`}).join('')}
       ${[-10,0,10,20,30].map(v=>`<span class="num muted" style="position:absolute;bottom:0;left:${fx(v)}%;transform:translateX(-50%);font-size:11px">${v>0?'+':v<0?'−':''}${Math.abs(v)}</span>`).join('')}
      </div><p class="note">An interval that crosses zero means no proven effect. GP-03 is reported anyway: publishing null results is what makes the wins credible.</p></div>
    </div>
    ${body}
  </div>`};

V.method=()=>head('Trust','Method and data quality','How the numbers are made, how reliable they are, and what we do not claim.')+
 `<div class="tiles t4">
   <div class="tile"><div class="lb">Answers captured</div><div class="val num">57,200</div><div class="lb muted" style="font-size:11.5px">last 28 days, 3 instruments</div></div>
   <div class="tile"><div class="lb">Failed or empty runs</div><div class="val num">1.1<small>%</small></div><div class="lb muted" style="font-size:11.5px">logged and excluded, never silently dropped</div></div>
   <div class="tile"><div class="lb">Brand detection accuracy</div><div class="val num">98<small>%</small></div><div class="lb muted" style="font-size:11.5px">precision · recall 96% on 300 hand-checked answers</div></div>
   <div class="tile"><div class="lb">Sentiment agreement with humans</div><div class="val num">0.71</div><div class="lb muted" style="font-size:11.5px">Cohen’s kappa; we re-check after every model change</div></div>
 </div>
 <div class="grid g2">
  <div class="panel"><div class="ph"><h2>How we collect</h2></div>
   <div class="scroll"><table class="t"><thead><tr><th>Instrument</th><th>Source</th><th>Schedule</th><th class="r">Answers</th></tr></thead><tbody>
    <tr><td>What users see</td><td class="ink2">ChatGPT, Gemini, Google AI Mode, Perplexity apps, logged out, India location, via licensed data providers</td><td class="ink2">100 prompts × 4 runs, daily</td><td class="r num">44,800</td></tr>
    <tr><td>Live web</td><td class="ink2">Official APIs with web search on</td><td class="ink2">50 key prompts × 4 engines × 2 runs, daily</td><td class="r num">11,200</td></tr>
    <tr><td>Model memory</td><td class="ink2">Official APIs, web search off</td><td class="ink2">100 prompts × 3 engines, weekly</td><td class="r num">1,200</td></tr>
   </tbody></table></div>
   <p class="note">We do not run logged-in bots against consumer apps. Every answer is stored raw with the model version that served it, so any number can be re-checked.</p></div>
  <div class="panel"><div class="ph"><h2>How we calculate</h2></div>
   <dl class="kv" style="grid-template-columns:150px 1fr">
    <dt>Mention rate</dt><dd>Answers naming the brand ÷ all valid answers, unbranded prompts only</dd>
    <dt>Share of voice</dt><dd>Brand mentions ÷ mentions of all tracked brands</dd>
    <dt>Position</dt><dd>Order in which the brand is first named (1 = first)</dd>
    <dt>Net sentiment</dt><dd>% positive − % negative, among answers naming the brand</dd>
    <dt>Intervals</dt><dd>95%, bootstrapped over question families, because repeated runs of one prompt are not independent</dd>
    <dt>Headline window</dt><dd>28 days. A single day of 8 runs ranges about ±28 pts, too noisy to report.</dd>
    <dt>Change alerts</dt><dd>A statistical alert fires when a series shifts beyond normal noise, for example after a model update</dd>
   </dl></div>
  <div class="panel" style="grid-column:1/-1"><div class="ph"><h2>What we do not claim</h2></div>
   <div class="grid g3" style="gap:10px">
    <div class="card"><div class="top"><span class="ttl">No guaranteed rankings</span></div><p class="ink2">The same question returns the same brand list less than 1% of the time. We report probabilities, not positions you own.</p></div>
    <div class="card"><div class="top"><span class="ttl">Not every user sees this</span></div><p class="ink2">Logged-in users, chat history and location change answers. Our panel is a consistent sample, not a census of all users.</p></div>
    <div class="card"><div class="top"><span class="ttl">No lift without a test</span></div><p class="ink2">A number going up after a change is not proof. We claim impact only from pre-registered experiments with a holdout.</p></div>
   </div></div>
 </div>`;

/* ---------------- tour ---------------- */
const TOUR=[
  ['overview','Start with one honest number','The share of real buyer questions where AI names NovaCRM, with its margin of error. Branded questions are excluded so the number cannot be flattered.'],
  ['overview','Three instruments, never blended','Model memory, live web and the consumer apps disagree. Reading them separately tells us whether a fix should target the site, third-party sources or long-term reputation.'],
  ['visibility','See who wins, and whether the gap is real','The leaderboard shows each competitor with an interval. If the whiskers overlap, we do not call it a win or a loss yet.'],
  ['prompts','Every number traces to an answer','Open any question family, pick an engine, and click a single run to read exactly what the AI said and how we scored it.'],
  ['sentiment','Find the story behind the sentiment','Negative claims are traced to the pages engines cite. Here, an outdated support claim comes from an old Reddit thread, old G2 reviews and the client’s own pricing page.'],
  ['citations','Find the sources that decide answers','Domains that cite competitors but not NovaCRM are the outreach list. Each engine leans on different sources.'],
  ['diagnose','Diagnose before you prescribe','For every family we find the first weak link: no page, not retrieved, not cited, or named but framed weakly. Each needs a different fix.'],
  ['actions','A plan with evidence labels','Each action says whether it is proven in this client’s data, backed by outside evidence, or a bet we will test.'],
  ['experiments','Prove the fix caused the lift','Change one group of questions, hold back another, register the test in advance, compare. This is what most GEO tools cannot show.'],
  ['method','Show the working','Collection method, formulas, accuracy checks and the claims we will not make. This page is the reason clients trust the rest.']];
let tourI=-1;
const tourEl=document.getElementById('tour');
function renderTour(){if(tourI<0){tourEl.hidden=true;return}const [r,t,b]=TOUR[tourI];if(state.route!==r)go(r,true);tourEl.hidden=false;
  tourEl.innerHTML=`<div class="k">Guided tour · ${tourI+1} of ${TOUR.length}</div><h2>${t}</h2><p>${b}</p><div class="bar"><div class="dots">${TOUR.map((_,k)=>`<i class="${k===tourI?'on':''}"></i>`).join('')}</div><button class="btn sm" id="tPrev" ${tourI===0?'disabled':''}>Back</button><button class="btn sm primary" id="tNext">${tourI===TOUR.length-1?'Finish':'Next'}</button><button class="btn sm" id="tClose" aria-label="Close tour">✕</button></div>`;
  tourEl.querySelector('#tPrev').onclick=()=>{tourI=Math.max(0,tourI-1);renderTour()};
  tourEl.querySelector('#tNext').onclick=()=>{tourI=tourI===TOUR.length-1?-1:tourI+1;renderTour()};
  tourEl.querySelector('#tClose').onclick=()=>{tourI=-1;renderTour()}}
document.getElementById('tourBtn').onclick=()=>{tourI=0;renderTour()};

/* ---------------- render & events ---------------- */
const view=document.getElementById('view');
function render(){for(const k in CHARTS)delete CHARTS[k];
  document.getElementById('navwrap').innerHTML=navHTML();
  view.innerHTML=V[state.route]();drawCharts();hideTip()}
function go(r,keepTour){if(!ROUTE_IDS.includes(r))r='overview';state.route=r;try{history.replaceState(null,'','#'+r)}catch(e){}render();window.scrollTo(0,0);if(!keepTour&&tourI>=0&&TOUR[tourI][0]!==r){tourI=-1;renderTour()}}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-fam]');if(!t)return;
  if(t.dataset.exp&&!t.dataset.go){state.exp=t.dataset.exp;render();return}
  if(t.dataset.go){if(t.dataset.exp)state.exp=t.dataset.exp;go(t.dataset.go);return}
  if(t.dataset.eng){state.eng=t.dataset.eng;render();return}
  if(t.dataset.fam){state.fam=t.dataset.fam;state.pi=0;state.cell=[6,2];render();if(innerWidth<1180){const d=document.getElementById('famDetail');if(d)d.scrollIntoView({block:'start'})}return}
  if(t.dataset.pi){state.pi=+t.dataset.pi;render();return}
  if(t.dataset.pe){state.pe=t.dataset.pe;render();return}
  if(t.dataset.cell){state.cell=t.dataset.cell.split(',').map(Number);render();return}
});
document.addEventListener('keydown',ev=>{const t=ev.target.closest&&ev.target.closest('tr[data-fam]');if(t&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();t.click()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==state.route&&ROUTE_IDS.includes(h))go(h)});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawCharts,120)});
(function init(){const h=(location.hash||'').slice(1);if(ROUTE_IDS.includes(h))state.route=h;render()})();
</script>
